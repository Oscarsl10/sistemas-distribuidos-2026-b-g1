events {}

http {
    # active.conf holds one line: set $active_upstream blue:8080; or green:8080;
    # The names are resolved when a request arrives, so the file can change with a reload only.
    resolver 127.0.0.11 valid=2s;

    server {
        listen 80;
        include /etc/nginx/edge/active.conf;

        location / {
            proxy_pass http://$active_upstream;
        }
    }
}
